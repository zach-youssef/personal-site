# Builds and tests every commit a push brings, each one in its own job, and posts a commit status
# on each, so a branch shows which of its commits pass. Then the deploy job (deploy.yml) deploys
# master's tip, or dry-runs a branch's. See "CI" and "Continuous deployment" in README.md.
#
# Only the jobs that run no code from the repository's commits, npm, Gradle or third-party actions
# can post statuses: the test jobs build and test with a read-only token, while the pending job
# marks the commits pending first and the statuses job posts each commit's outcome afterwards, from
# this run's jobs. Neither checks anything out.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to a working branch supersedes its running checks. Every run on the default branch
# finishes: each has its own group, since a group holds only one pending run and drops the others.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref_name == github.event.repository.default_branch && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Unlike the default bash -e, this sets pipefail
    shell: bash

jobs:
  commits:
    name: List commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.list.outputs.shas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # A push can bring more commits than are worth a job each; the newest are checked
          LIMIT: 20
        run: |
          # On the default branch, the commits the push added. Elsewhere, every commit on the
          # branch that the default branch doesn't have, as a force push may have rewritten any.
          if [[ ${GITHUB_REF} == refs/heads/${DEFAULT} ]]; then
              if [[ ${BEFORE} =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                  range=${AFTER}^!
              else
                  range=${BEFORE}..${AFTER}
              fi
          else
              range=origin/${DEFAULT}..${AFTER}
          fi
          shas=$(git rev-list --reverse "${range}" | tail -n "${LIMIT}")
          # A branch at the default branch (or a manual run there) still checks its tip
          shas=${shas:-${AFTER}}
          echo "Checking $(wc -l <<< "${shas}") commit(s) of ${range}"
          echo "shas=$(jq -cnR '[inputs]' <<< "${shas}")" >> "${GITHUB_OUTPUT}"

  pending:
    name: Mark pending
    needs: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHAS: ${{ needs.commits.outputs.shas }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Each call is tried three times, and a failure doesn't stop the other commits' statuses
      - name: Mark the commits pending
        run: |
          failed=0
          api() { for try in 1 2 3; do gh api "$@" && return; sleep 5; done; return 1; }
          for sha in $(jq -r '.[]' <<< "${SHAS}"); do
              if [[ ! ${sha} =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::Not a commit SHA: '${sha}'"
                  failed=1
                  continue
              fi
              api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" --silent -f state=pending \
                  -f context="CI / test" -f target_url="${RUN_URL}" \
                  -f description="Building and testing" || failed=1
          done
          exit "${failed}"

  test:
    name: Test ${{ matrix.sha }}
    needs: commits
    # An empty matrix fails the workflow; the commits job always lists at least the tip
    if: needs.commits.outputs.shas != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read-only: this job runs the commits' code, npm and Gradle, so it gets no token that can
    # post statuses (the statuses job posts them)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.commits.outputs.shas) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          # Keeps the job's token out of git's config, where the npm and Gradle steps could read it
          persist-credentials: false
      - name: Set up the build
        # Checks out the submodules, SeamCarving's with its deploy key before any third-party code
        # runs, and installs the toolchains
        uses: ./.github/actions/setup-build
        with:
          seamcarving-deploy-key: ${{ secrets.SEAMCARVING_DEPLOY_KEY }}

      - name: Deploy tests
        # The runner has flock, as the server does, so the lock tests must run rather than skip.
        # The full log only on a failure.
        run: |
          log=${RUNNER_TEMP}/deploy-test.log
          if ! tests/deploy-test.sh > "${log}" 2>&1; then
              cat "${log}"
              exit 1
          fi
          if grep -q 'lock tests skipped' "${log}"; then
              cat "${log}"
              echo "::error::The deploy lock tests were skipped"
              exit 1
          fi
          echo "$(grep -c '^--- ' "${log}") deploy tests passed, lock tests included"

      - name: Frontend tests
        working-directory: frontend
        env:
          CI: 1
        run: npm ci --no-audit --no-fund && npm test
      - name: Build the PPU's games
        run: ./build-ppu
      - name: Build ZGAL's examples
        run: ./build-zgal
      - name: Build the splat viewer
        # The release's scene comes from the download cache that setup-build restores
        run: ./build-splat
      - name: Upload the screenshots
        # Drawn on lavapipe here rather than on the Mac's GPU, so they can differ from the live ones
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.sha }}
          path: |
            graphql-server/assets/zgal/*/screenshot.webp
            graphql-server/assets/splat/screenshot.webp
          # Only for comparing with the live one now and then
          retention-days: 7

      - name: Backend tests
        working-directory: graphql-server
        run: ./gradlew test --console=plain
      - name: Upload the backend's test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report-${{ matrix.sha }}
          path: graphql-server/build/reports/tests/
          if-no-files-found: ignore

      - name: End-to-end tests
        working-directory: e2e
        env:
          CI: 1
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium > /dev/null
          npm test
      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.sha }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # Once every commit passes, builds the tip's bundle and deploys it: on the default branch to the
  # server, elsewhere as a dry run. See deploy.yml.
  deploy:
    name: Deploy
    needs: test
    permissions:
      contents: read
      # The dry run reads the last deployed manifest from the repository's artifacts
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      ship: ${{ github.ref_name == github.event.repository.default_branch }}
    secrets: inherit

  # Posts each commit's `CI / test` status from the conclusion of its job ("Test <sha>") in this
  # run: success and failure as they are, anything else (cancelled, timed out, skipped, never run,
  # or unreadable) as an error, so no commit stays pending. Each call is tried three times, and a
  # failure doesn't stop the other commits' statuses.
  statuses:
    name: Post statuses
    needs: [commits, pending, test]
    if: always() && needs.commits.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHAS: ${{ needs.commits.outputs.shas }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post the commits' statuses
        run: |
          failed=0 listed=1
          api() { for try in 1 2 3; do gh api "$@" && return; sleep 5; done; return 1; }
          # The latest attempt of each of the run's jobs
          if jobs=$(api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | {name, conclusion, html_url}'); then
              jobs=$(jq -cs . <<< "${jobs}")
          else
              echo "::error::Couldn't list the run's jobs"
              jobs='[]' listed=0 failed=1
          fi
          for sha in $(jq -r '.[]' <<< "${SHAS}"); do
              if [[ ! ${sha} =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::Not a commit SHA: '${sha}'"
                  failed=1
                  continue
              fi
              job=$(jq -c --arg name "Test ${sha}" 'map(select(.name == $name)) | last // {}' <<< "${jobs}")
              conclusion=$(jq -r '.conclusion // "missing"' <<< "${job}")
              [[ ${listed} == 1 ]] || conclusion=unreadable
              url=$(jq -r --arg run "${RUN_URL}" '.html_url // $run' <<< "${job}")
              case ${conclusion} in
                  success) state=success description=Passed ;;
                  failure) state=failure description=Failed ;;
                  cancelled | timed_out) state=error description="Cancelled or timed out" ;;
                  unreadable) state=error description="Couldn't read its job's outcome" ;;
                  *) state=error description="Not run (${conclusion})" ;;
              esac
              echo "${sha}: ${conclusion} -> ${state}"
              api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" --silent -f state="${state}" \
                  -f context="CI / test" -f target_url="${url}" \
                  -f description="${description}" || failed=1
          done
          exit "${failed}"
