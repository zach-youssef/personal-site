version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directories:
      - /graphql-server
      - /seamcarver-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    # The seam carver's Rust engine. Its wasm-bindgen is pinned exactly, and CI installs the
    # wasm-bindgen-cli of whatever Cargo.lock says, so a bump here carries the cli with it. The
    # toolchain (rust-toolchain.toml) isn't Dependabot's; bump it by hand.
    directories:
      - /seamcarver-web/flat
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # The workflows and the local composite action (.github/actions/setup-build) both pin actions.
    directories:
      - /
      - /.github/actions/setup-build
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
