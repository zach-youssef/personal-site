[package]
name = "seamcarver-flat"
version = "0.1.0"
edition = "2024"
publish = false
description = "The seam carver's flat-array engine, pixel-identical to the original SeamCarving Java"

[lib]
# cdylib for the WebAssembly module, rlib for the native tests and benchmark
crate-type = ["cdylib", "rlib"]

# Only the WebAssembly build needs the JS glue; the native tests and benchmark stay dependency-free.
# The exact version is the one wasm-bindgen-cli must have (build.sh wasm-bindgen-version reads it
# from Cargo.lock); the cli refuses a module built with another version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[[bench]]
name = "carve"
harness = false

# Measured 2026-11-24 (wasm-bindgen 0.2.130, Rust 1.100): with LTO, opt-level 3 gives a smaller
# module than "s" (38.5 KB against 47.9 KB) and a 3% faster carve, so there is no size/speed trade
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
