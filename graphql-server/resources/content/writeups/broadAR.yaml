# The broadAR project page's copy; its title and image are its card's, in ../projects.yaml.
# See "Site copy" in the README. The server refuses to start if this file is invalid.
#
#   context:  one line under the title: employer, year, role
#   imageAlt: the alt text of the page's image (the card's thumbnail)
#   sections: the body, in order; each has a `text` and may have a `heading`. Paste the text
#             into the `|` block, indented; blank lines separate paragraphs, and the line breaks
#             inside a paragraph are joined with spaces, so hard-wrapped text is fine.
#   articles: at least one; each has a title, source (the publisher), url (https://), note (one
#             line on what it covers) and, if known, date ("YYYY-MM" or "YYYY-MM-DD").
#
# Quote values YAML would otherwise read as something else: dates, numbers, and words like
# yes, no, on and off ("2024-09", "yes"). Placeholders start with TODO(copy).

context: "Meta, 2022"
imageAlt: >-
  A phone's camera view at The Broad: a person in a bucket hat waves beneath a cluster of
  Takashi Murakami's smiling AR flowers while visitors film on their phones
sections:
  - text: |
      Location Based AR Experience at The Broad
  - heading: "Context"
    text: |
      During my first year at Meta, I worked on a Spark AR team focused on building out capabilities and templates for
      creators to build location based AR experiences on the Spark Platform.

      I worked on relative positioning based experiences that were launched from a QR code, then used relative tracking
      to that QR code image to place 3D augments in the world (viewable through the user's smartphone in Instagram).

      The result of this work was a collaboration with the Broad Museum to place 3D art inspired by Murakami's work
      alongside his exhibit there.
articles:
  - title: Meta x Murakami at The Broad
    source: BUCK
    url: https://buck.co/work/meta-x-murakami-at-the-broad
    note: "Article from the contractors we partnered with to create the Murakami experience"
  - title: major takashi murakami exhibition with digital immersive environments opens at the broad
    source: designboom
    date: "2022-05-24"
    url: https://www.designboom.com/art/major-takashi-murakami-exhibition-with-digital-immersive-environments-the-broad-05-24-2022/
    note: "Exhibition-opening coverage, including the Instagram AR in the plaza, lobby and galleries"
  - title: Takashi Murakami opens major augmented reality show at The Broad in Los Angeles
    source: The Art Newspaper
    date: "2022-06-02"
    url: https://www.theartnewspaper.com/2022/06/02/murakami-the-broad
    note: "The AR show's launch: sidewalk QR codes opening Instagram effects, built with BUCK and Meta Spark"
  - title: "Tools Of The Trade: How Buck And Takashi Murakami Used Spark AR To Bring The Artist's Work To Life"
    source: Cartoon Brew
    date: "2022-08-17"
    url: https://www.cartoonbrew.com/tools-of-the-trade/spark-ar-helena-dong-takashi-murakami-220071.html
    note: "How the experience was built: floor targets launching Instagram effects that track to place the art"
