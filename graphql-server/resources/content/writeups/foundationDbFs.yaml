#   context:  one line under the title: school, course, year
#   video:    shown in place of the card's image: the YouTube id and a title
#   sections: the body, in order; each has a `text` and may have a `heading` and `figures`. Paste
#             the text into the `|` block, indented; blank lines separate paragraphs, and the line
#             breaks inside a paragraph are joined with spaces, so hard-wrapped text is fine.
#             A figure is an SVG in graphql-server/assets/writeups/foundationDbFs/ (see "Write-up
#             diagrams" in the README), with alt text and a caption.
#   links:    buttons under the body: a title and an https:// url
#
# Adapted from the project's README (github.com/zach-youssef/foundationdb-fs).
