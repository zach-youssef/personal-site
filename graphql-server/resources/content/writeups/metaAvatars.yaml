# The metaAvatars project page's copy; its title and image are its card's, in ../projects.yaml.
# See "Site copy" in the README. The server refuses to start if this file is invalid.
#
#   context:  one line under the title: employer, year, role
#   imageAlt: the alt text of the page's image (the card's thumbnail)
#   sections: the body, in order; each has a `text` and may have a `heading`. Paste the text
#             into the `|` block, indented; blank lines separate paragraphs, and the line breaks
#             inside a paragraph are joined with spaces, so hard-wrapped text is fine.
#   articles: at least one; each has a title, source (the publisher), url (https://), note (one
#             line on what it covers) and, if known, date ("YYYY-MM" or "YYYY-MM-DD").
#
# Quote values YAML would otherwise read as something else: dates, numbers, and words like
# yes, no, on and off ("2024-09", "yes"). Placeholders start with TODO(copy).

context: "Meta, 2022 - 2026"
imageAlt: >-
  Six of Meta's restyled 3D avatars on the stage screen at Meta Connect 2024
sections:
  - heading: "Meta Style 2 Avatars"
    text: |
      I spent most of my time at Meta working on Avatars in various capacities, on mobile, VR,
      and unreleased AR/MR devices.
  - heading: "Avatar Mobile 3D Editor"
    text: |
      My most significant contributions came in the 3D Avatar editor, where I integrated our Avatar
      pipeline into the SparkAR rendering engine for use with live parametric editing.

      This included significant graphics feature and performance work to support the Style 2 upgrade that Avatars received,
      including real time parametric colorization in compute shaders and cramming the hundreds of blendshapes required
      for full parametric body editing into a mobile GPU.
  - heading: "Other Avatar Projects"
    text: |
      Some other highlights were unreleased demo experiences in MR & AR, Avatar Real Time Calling in Messenger,
      some invisible but highly satisfying codebase refactors, contributing to the versioning and release cycle
      for the AvatarSDK, and writing compute shaders for GPU compact morph targets and real time bounding box
      & raycasting interactions.
